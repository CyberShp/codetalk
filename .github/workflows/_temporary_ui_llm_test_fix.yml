name: Temporary UI-promotion LLM test fix

on:
  pull_request:
    branches: [UI-promotion]
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: github.head_ref == 'agent/llm-test-route-fix-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: UI-promotion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused fix
        run: python scripts/_oneshot_fix_llm_test_route.py

      - name: Validate backend source contract
        shell: bash
        run: |
          python -m compileall -q backend/app
          grep -q '@router.post("/llm/actions/test-connection")' backend/app/api/settings.py
          grep -q '"/api/settings/llm/actions/test-connection"' frontend/src/lib/api.ts
          ! grep -R '_require_approved_model_endpoint' backend/app/llm/openai_compat.py backend/app/llm/anthropic.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --webpack

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix LLM test connection route'
          git push origin HEAD:UI-promotion

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment '${{ github.event.pull_request.number }}' --repo '${{ github.repository }}' --body 'LLM test route fix validated: backend source compiled and frontend production build passed. UI-promotion was updated.'
